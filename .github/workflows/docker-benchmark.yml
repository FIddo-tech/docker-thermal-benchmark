name: Docker benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t physics-benchmark:v1 .

      - name: Run the solver and the pytest verifier inside the container
        run: docker run --rm physics-benchmark:v1
